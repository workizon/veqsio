services:
  postgres:
    image: postgres:15-alpine
    container_name: veqsio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veqsio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-veqsio}
    ports:
      # Exposed for local dev / deploy script migrations (reset-demo.sh connects via localhost:5460).
      # Bound to loopback so the database is not reachable from the internet.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5460}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veqsio} -d ${POSTGRES_DB:-veqsio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veqsio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: valkey/valkey:8-alpine
    container_name: veqsio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veqsio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      args:
        VEQSIO_BUILD: ${VEQSIO_BUILD:-dev}
    container_name: veqsio-api
    restart: unless-stopped
    # No capabilities and no way to gain more: a flaw in the application then has no privileges to misuse inside the container
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      # Proxies in front of the API (host proxy, then nginx here): the address of the person is the second entry from the right of X-Forwarded-For.
      # Without this every visitor is the same address to the rate limits and the sign-in lock.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-veqsio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-veqsio}
      REDIS_URL: redis://redis:6379
      WEB_URL: ${WEB_URL:-https://veqsio.example.com}
      BASE_URL: ${BASE_URL:-https://veqsio.example.com}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      OIDC_REDIRECT_BASE_URL: ${OIDC_REDIRECT_BASE_URL:-}
      PAT_MAX_EXPIRY_DAYS: ${PAT_MAX_EXPIRY_DAYS:-365}
      PAT_DEFAULT_EXPIRY_DAYS: ${PAT_DEFAULT_EXPIRY_DAYS:-90}
      MOCK_STORAGE_DIR: /app/uploads
      MIGRATION_UPLOAD_DIR: /app/uploads/migrations
      STORAGE_TYPE: ${STORAGE_TYPE:-r2}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-veqsio-attachments}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      # Enterprise licence (optional; it can also be pasted in Administration > System > Licence)
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VEQSIO_ROLE: ${VEQSIO_ROLE:-all}
      VEQSIO_LICENSE_KEY: ${VEQSIO_LICENSE_KEY:-}
      VEQSIO_LICENSE_PUBLIC_KEYS: ${VEQSIO_LICENSE_PUBLIC_KEYS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      # status files written by scripts/backup.sh and scripts/restore-verify.sh ("Last verified backup" card)
      - ./backups:/app/backups:ro
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - veqsio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VEQSIO_BUILD: ${VEQSIO_BUILD:-dev}
    container_name: veqsio-web
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://veqsio.example.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - veqsio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: veqsio-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # SSL is handled by HestiaCP system nginx which proxies to this port
      - "127.0.0.1:${NGINX_HTTP_PORT:-3002}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/certbot:/etc/letsencrypt:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - veqsio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Certbot SSL initialization (run once with: docker compose --profile ssl-init up certbot)
  certbot:
    image: certbot/certbot:latest
    container_name: veqsio-certbot
    restart: "no"
    volumes:
      - ./nginx/certbot:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      # The guard is inside the command, not a `${VAR:?}` expansion: Compose expands every service when it loads the file, so a `:?` here made
      # `docker compose` fail for installations without a domain (install.sh writes VEQSIO_DOMAIN="") although certbot is never started.
      - "[ -n \"${VEQSIO_DOMAIN:-}\" ] || { echo 'set VEQSIO_DOMAIN in .env' >&2; exit 1; }; certbot certonly --standalone --preferred-challenges http -d \"${VEQSIO_DOMAIN:-}\" --agree-tos --no-eff-email -m ${VEQSIO_SSL_EMAIL:-} --keep-until-expiring --non-interactive"
    ports:
      - "80:80"
    networks:
      - veqsio-network
    profiles:
      - ssl-init

  prometheus:
    image: prom/prometheus:latest
    container_name: veqsio-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - veqsio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  grafana:
    image: grafana/grafana:latest
    container_name: veqsio-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://jira.wup.lv/grafana}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3061}:3000"
    depends_on:
      - prometheus
    networks:
      - veqsio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Backup and restore verification (docs/backup-and-recovery.md). Run on a schedule from the host's cron:
  #   docker compose --profile backup run --rm backup           # pg_dump -> ./backups/veqsio_<ts>.dump (+ last-backup.json)
  #   docker compose --profile backup run --rm backup-verify    # restore into a scratch database, check, drop (+ last-verify.json)
  # The API reads ./backups/last-*.json (mounted read-only below) for Administration > Configuration health.
  backup:
    image: postgres:15-alpine
    container_name: veqsio-backup
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-veqsio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-veqsio}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "apk add --no-cache bash coreutils findutils tar >/dev/null && bash /backup.sh"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - veqsio-network
    profiles:
      - backup

  backup-verify:
    image: postgres:15-alpine
    container_name: veqsio-backup-verify
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-veqsio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-veqsio}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./scripts/restore-verify.sh:/restore-verify.sh:ro
      - ./packages/db/drizzle/meta/_journal.json:/packages/db/drizzle/meta/_journal.json:ro
    command: >
      sh -c "apk add --no-cache bash coreutils >/dev/null && bash /restore-verify.sh"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - veqsio-network
    profiles:
      - backup

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  prometheus_data:
  grafana_data:

networks:
  veqsio-network:
    driver: bridge
