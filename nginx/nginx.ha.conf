# Load balancer for docker-compose.ha.yml (see docs/multi-node.md).
# No sticky sessions: sessions live in Redis, files in object storage, WebSocket events fan out through Redis.
# /metrics, /ready and the OpenAPI/ops endpoints that must not be public are NOT proxied: scrape the nodes directly
# on the internal network (api1:3000, api2:3000, worker:3000).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The request id: reuse the client's/edge's X-Request-Id, otherwise nginx's own. The API echoes it in the response
    # and in every log line of the request, so a request can be followed from the balancer through any node.
    map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time rt=$upstream_response_time up=$upstream_addr rid=$req_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 110m;   # >= STORAGE_MAX_FILE_SIZE (100 MiB default)

    # Docker's DNS returns the container addresses; for a fixed set of replicas list them. max_fails/fail_timeout take a
    # node out after failed connections or 5xx; the compose health checks (/ready) stop a draining node from receiving
    # new traffic through the container runtime. With nginx Plus or an external LB use active /ready checks instead.
    upstream api {
        least_conn;
        server api1:3000 max_fails=2 fail_timeout=10s;
        server api2:3000 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }
    upstream web {
        server web1:3000 max_fails=2 fail_timeout=10s;
        server web2:3000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUSTED_PROXY_HOPS=1 on the API: it takes the LAST entry, i.e. the address THIS balancer saw.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503;   # a draining node answers 503 on /ready only; this retries idempotent failures
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header X-Request-Id $req_id always;

        location = /health { proxy_pass http://api/health; }

        location /rest/ { proxy_pass http://api; }
        location /scim/ { proxy_pass http://api; }
        location /auth/ { proxy_pass http://api; }

        location /ws {
            proxy_pass http://api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        location / { proxy_pass http://web; }
    }
}
