# EXAMPLE: two stateless API replicas + one job worker + two web replicas behind an nginx load balancer, with shared
# PostgreSQL, Redis and S3-compatible object storage (MinIO here; use your cloud bucket in production).
# Read docs/multi-node.md first. This file is a starting point for a single Docker host to try the topology and to run the
# verification checklist; for real high availability run the replicas on different hosts and use managed PostgreSQL/Redis.
#
#   cp .env.example .env     # set POSTGRES_PASSWORD, SECRETS_ENCRYPTION_KEY (identical on all nodes!), METRICS_TOKEN, ...
#   docker compose -f docker-compose.ha.yml build
#   docker compose -f docker-compose.ha.yml --profile tools run --rm migrate      # once per upgrade, BEFORE the API starts
#   docker compose -f docker-compose.ha.yml up -d
#   curl -fsS http://localhost:8080/health
#
# What is deliberately different from docker-compose.prod.yml
#   - api1/api2 run VEQSIO_ROLE=web: HTTP + WebSocket only, no timers. `worker` runs VEQSIO_ROLE=worker: all background jobs.
#     (You could also run every node with VEQSIO_ROLE=all: the jobs take PostgreSQL advisory locks, so that is safe too.)
#   - no container_name (replicas need unique names), no uploads volume (attachments live in object storage),
#   - health checks use /ready for the load balancer and /health for the container runtime,
#   - SECRETS_ENCRYPTION_KEY, WEB_URL, BASE_URL and DATABASE_URL are identical on every node.
x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER:-veqsio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-veqsio}
  REDIS_URL: redis://redis:6379
  WEB_URL: ${WEB_URL:-http://localhost:8080}
  BASE_URL: ${BASE_URL:-http://localhost:8080}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?same value on every node}
  # shared object storage: no node-local attachment files
  STORAGE_TYPE: s3
  STORAGE_ENDPOINT: http://minio:9000
  STORAGE_BUCKET: ${STORAGE_BUCKET:-veqsio-attachments}
  STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-veqsio}
  STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  STORAGE_REGION: us-east-1
  # the load balancer is the one trusted proxy hop (rate limiting uses the address it appends to X-Forwarded-For)
  TRUSTED_PROXY_HOPS: 1
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_DRAIN_MS: 5000
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  VEQSIO_LICENSE_KEY: ${VEQSIO_LICENSE_KEY:-}

x-api: &api
  build:
    context: .
    dockerfile: packages/api/Dockerfile
    args:
      VEQSIO_BUILD: ${VEQSIO_BUILD:-dev}
  restart: unless-stopped
  stop_grace_period: 40s   # > SHUTDOWN_DRAIN_MS + SHUTDOWN_TIMEOUT_MS (5 s + 25 s default) so SIGTERM can finish
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  networks: [veqsio-ha]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veqsio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-veqsio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veqsio} -d ${POSTGRES_DB:-veqsio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [veqsio-ha]

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [veqsio-ha]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veqsio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [veqsio-ha]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-veqsio-attachments}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veqsio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    restart: "no"
    networks: [veqsio-ha]

  # One-shot: apply migrations ONCE per upgrade before any new API node starts (never from every replica).
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.tools
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-veqsio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-veqsio}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [veqsio-ha]

  api1:
    <<: *api
    environment:
      <<: *api-env
      VEQSIO_ROLE: web

  api2:
    <<: *api
    environment:
      <<: *api-env
      VEQSIO_ROLE: web

  # Runs the schedulers (email queue, SLA breaches, digests, intake snooze, approvals, IMAP, recurring issues, module
  # jobs). Not in the load balancer's upstream. Scrape its /metrics to alert on job heartbeats.
  worker:
    <<: *api
    environment:
      <<: *api-env
      VEQSIO_ROLE: worker

  web1:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VEQSIO_BUILD: ${VEQSIO_BUILD:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://lb}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [veqsio-ha]

  web2:
    extends:
      service: web1
    restart: unless-stopped

  # Load balancer: round robin (no sticky sessions needed), passive + active checks via /ready, WebSocket upgrade for /ws.
  lb:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HA_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.ha.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
      web1: { condition: service_healthy }
    networks: [veqsio-ha]

networks:
  veqsio-ha:

volumes:
  postgres_data:
  redis_data:
  minio_data:
