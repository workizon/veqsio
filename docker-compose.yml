version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: veqsio-postgres
    environment:
      POSTGRES_USER: veqsio
      POSTGRES_PASSWORD: veqsio
      POSTGRES_DB: veqsio
    ports:
      - '127.0.0.1:5460:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veqsio -d veqsio']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    container_name: veqsio-redis
    ports:
      - '127.0.0.1:6381:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
